default: &default
  adapter: postgresql
  encoding: anicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: test_app_development

test:
  <<: *default
  database: test_app_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>  # <--- This ensures Rails connects to Heroku's DB
